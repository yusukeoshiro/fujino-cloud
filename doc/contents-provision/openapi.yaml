openapi: '3.0.3'
info:
  title: Mobili Content Provider API Specifications
  version: '1.0.0-v1'
  description: >
    REST contract for providers exposing metric definitions, performance assessment
    templates, and external score calculation to the Mobili platform.
servers:
  - url: https://provider.example.com/contents/v1
    description: Example provider base URL (versioned)
tags:
  - name: capabilities
    description: Provider capability declaration
  - name: metric-definitions
    description: Metric definition catalog
  - name: performance-assessment-templates
    description: Performance assessment templates
  - name: score-providers
    description: External score calculation
  - name: device-input-configs
    description: Device input configuration (gate/session layouts) surfaced by the provider
paths:
  /capabilities:
    get:
      tags: [capabilities]
      summary: Declare which content types are implemented
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Capabilities response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /metric-definitions:
    get:
      tags: [metric-definitions]
      summary: List all metric definitions
      description: Returns all metric definitions; responses must contain fewer than 1000 items.
      responses:
        '200':
          description: Metric definition list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricDefinitionListResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
        - bearerAuth: []
  /metric-definitions/{id}:
    get:
      tags: [metric-definitions]
      summary: Fetch a single metric definition
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Metric definition detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricDefinition'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
        - bearerAuth: []
  /performance-assessment-templates:
    get:
      tags: [performance-assessment-templates]
      summary: List performance assessment templates
      description: Returns all templates; responses must contain fewer than 1000 items.
      responses:
        '200':
          description: Performance assessment template list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformanceAssessmentTemplateListResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
        - bearerAuth: []
  /performance-assessment-templates/{id}:
    get:
      tags: [performance-assessment-templates]
      summary: Fetch a single performance assessment template
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Performance assessment template detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformanceAssessmentTemplateDetail'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
        - bearerAuth: []
  /score-providers/calculate:
    post:
      tags: [score-providers]
      summary: Calculate a score without exposing proprietary formulas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoreCalculationRequest'
      responses:
        '200':
          description: Score calculation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoreCalculationResponse'
        '400':
          description: Functional error (e.g., validation/out-of-range)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseBody'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
        - bearerAuth: []
  /device-input-configs:
    get:
      tags: [device-input-configs]
      summary: List all device input configs (gate/session layouts)
      description: Returns all device input configs; responses must contain fewer than 1000 items.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of device input configs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceInputConfigListResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /device-input-configs/{id}:
    get:
      tags: [device-input-configs]
      summary: Fetch a single device input config
      parameters:
        - $ref: '#/components/parameters/PathId'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Device input config detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceInputConfig'
        default:
          $ref: '#/components/responses/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Provider-issued API token configured by the Mobili customer. Mobili sends
        `Authorization: Bearer <token>` on every call.
  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    ErrorResponse:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseBody'
  schemas:
    CapabilitiesResponse:
      type: object
      properties:
        version:
          type: string
          example: v1
        capabilities:
          type: object
          properties:
            metricDefinitions:
              type: boolean
            deviceInputConfigs:
              type: boolean
            scoreProviders:
              type: boolean
            performanceAssessmentTemplates:
              type: boolean
            performanceAssessments:
              type: boolean
            referenceLevels:
              type: boolean
          required:
            - metricDefinitions
            - deviceInputConfigs
            - scoreProviders
            - performanceAssessmentTemplates
            - performanceAssessments
            - referenceLevels
      required:
        - version
        - capabilities
    MetricDefinition:
      type: object
      properties:
        id:
          type: string
          example: md-123
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        orgId:
          type: string
          nullable: true
        isPublic:
          type: boolean
        name:
          type: string
        nameI18n:
          type: array
          items:
            $ref: '#/components/schemas/LocalizedString'
          nullable: true
        description:
          type: string
        descriptionI18n:
          type: array
          items:
            $ref: '#/components/schemas/LocalizedString'
          nullable: true
        type:
          $ref: '#/components/schemas/MetricDefinitionType'
        category:
          type: string
        betterDirection:
          $ref: '#/components/schemas/BetterDirection'
        formula:
          type: string
          nullable: true
          example: '$WEIGHT / (($HEIGHT / 100) ^ 2)'
        sourceMetricDefinitionIds:
          type: array
          items:
            type: string
          nullable: true
          example: ['WEIGHT', 'HEIGHT']
        unit:
          $ref: '#/components/schemas/MetricUnit'
        roundingPrecision:
          type: integer
          minimum: 0
          maximum: 5
        meta:
          type: object
          additionalProperties: true
      required:
        - id
        - createdAt
        - updatedAt
        - name
        - description
        - type
        - category
        - betterDirection
        - formula
        - unit
        - roundingPrecision
        - isPublic
    MetricDefinitionListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MetricDefinition'
      required:
        - items
      example:
        items:
          - id: MD1
            createdAt: '2024-01-01T00:00:00Z'
            updatedAt: '2024-01-02T00:00:00Z'
            orgId: null
            isPublic: true
            name: weight
            description: Body weight
            type: raw
            category: body
            betterDirection: LOWER_IS_BETTER
            formula: null
            sourceMetricDefinitionIds: []
            unit: KILOGRAM
            roundingPrecision: 1
            meta: {}
          - id: MD2
            createdAt: '2024-01-01T00:00:00Z'
            updatedAt: '2024-01-02T00:00:00Z'
            orgId: null
            isPublic: true
            name: height
            description: Body height
            type: raw
            category: body
            betterDirection: HIGHER_IS_BETTER
            formula: null
            sourceMetricDefinitionIds: []
            unit: CENTIMETER
            roundingPrecision: 1
            meta: {}
          - id: MD3
            createdAt: '2024-01-01T00:00:00Z'
            updatedAt: '2024-01-02T00:00:00Z'
            orgId: null
            isPublic: true
            name: BMI
            description: Body mass index
            type: derived
            category: body
            betterDirection: LOWER_IS_BETTER
            formula: '$MD1 / (($MD2 / 100) ^ 2)'
            sourceMetricDefinitionIds:
              - MD1
              - MD2
            unit: UNITLESS
            roundingPrecision: 1
            meta: {}
    BetterDirection:
      type: string
      enum: [LOWER_IS_BETTER, HIGHER_IS_BETTER]
    MetricDefinitionType:
      type: string
      enum: [raw, derived]
    MetricUnit:
      type: string
      enum:
        - UNITLESS
        - CENTIMETER
        - KILOGRAM
        - COUNT
        - PERCENT
        - METER
        - SECOND
        - MINUTE
        - HOUR
        - KMPH
    DeviceInputConfig:
      type: object
      properties:
        id:
          type: string
          example: dic-001
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        orgId:
          type: string
          nullable: true
        deviceType:
          $ref: '#/components/schemas/DeviceType'
        collectionMode:
          $ref: '#/components/schemas/CollectionMode'
        mainMetricDefinitionId:
          type: string
          example: MD1
        gatePathSteps:
          type: array
          items:
            $ref: '#/components/schemas/GatePathStep'
        readyConditions:
          type: array
          items:
            $ref: '#/components/schemas/ReadyCondition'
        allowStaggeredStart:
          type: boolean
          description: Allow parallel participants to start before the previous finishes.
        contentProviderId:
          type: string
          nullable: true
      required:
        - id
        - createdAt
        - updatedAt
        - deviceType
        - collectionMode
        - mainMetricDefinitionId
        - gatePathSteps
        - readyConditions
        - allowStaggeredStart
    DeviceInputConfigListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DeviceInputConfig'
      required:
        - items
      example:
        items:
          - id: dic-001
            createdAt: '2024-01-01T00:00:00Z'
            updatedAt: '2024-01-02T00:00:00Z'
            orgId: null
            deviceType: GATE
            collectionMode: GATE_SESSION_V2
            mainMetricDefinitionId: MD1
            gatePathSteps:
              - gateIndex: 0
                state: BLOCKING
                captureTimestamp: true
                captureOptions:
                  metricDefinitionId: MD1
                  type: ABSOLUTE
                  relativeToStepIndex: null
                resetTime: true
                engageSession: true
                readyNext: false
            readyConditions:
              - gateIndex: 0
                requiredState: NON_BLOCKING
            allowStaggeredStart: false
            contentProviderId: null
    GatePathStep:
      type: object
      properties:
        gateIndex:
          type: integer
          format: int32
        state:
          $ref: '#/components/schemas/BlockingState'
        captureTimestamp:
          type: boolean
        captureOptions:
          $ref: '#/components/schemas/CaptureOptions'
          nullable: true
        resetTime:
          type: boolean
        engageSession:
          type: boolean
        readyNext:
          type: boolean
          nullable: true
      required:
        - gateIndex
        - state
        - captureTimestamp
        - resetTime
        - engageSession
    CaptureOptions:
      type: object
      properties:
        metricDefinitionId:
          type: string
        type:
          $ref: '#/components/schemas/CaptureType'
        relativeToStepIndex:
          type: integer
          format: int32
          nullable: true
      required:
        - metricDefinitionId
        - type
    ReadyCondition:
      type: object
      properties:
        gateIndex:
          type: integer
          format: int32
        requiredState:
          $ref: '#/components/schemas/BlockingState'
      required:
        - gateIndex
        - requiredState
    DeviceType:
      type: string
      enum: [GATE, UNKNOWN]
      example: GATE
    CollectionMode:
      type: string
      enum: [GATE_SESSION_V2, GROUP_DROPOUT_V1, SIMPLE_INPUT_V1]
      example: GATE_SESSION_V2
    BlockingState:
      type: string
      enum: [BLOCKING, NON_BLOCKING]
      example: BLOCKING
    CaptureType:
      type: string
      enum: [ABSOLUTE, RELATIVE]
      example: ABSOLUTE
    PerformanceAssessmentTemplateItem:
      type: object
      properties:
        id:
          type: string
          example: pat-10
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        orgId:
          type: string
        name:
          type: string
        nameI18n:
          type: array
          items:
            $ref: '#/components/schemas/LocalizedString'
          nullable: true
        description:
          type: string
          nullable: true
        descriptionI18n:
          type: array
          items:
            $ref: '#/components/schemas/LocalizedString'
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/PerformanceAssessmentTemplateMetricItem'
        meta:
          type: object
          additionalProperties: true
      required:
        - id
        - createdAt
        - updatedAt
        - orgId
        - name
        - items
    PerformanceAssessmentTemplateListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PerformanceAssessmentTemplateItem'
      required:
        - items
    PerformanceAssessmentTemplateDetail:
      allOf:
        - $ref: '#/components/schemas/PerformanceAssessmentTemplateItem'
    PerformanceAssessmentTemplateMetricItem:
      type: object
      properties:
        metricDefinitionId:
          type: string
        scored:
          type: boolean
      required:
        - metricDefinitionId
        - scored
    ScoreCalculationRequest:
      type: object
      properties:
        metricDefinitionId:
          type: string
        value:
          type: number
        referenceLevel:
          type: string
          nullable: true
        context:
          type: object
          additionalProperties: true
      required:
        - metricDefinitionId
        - value
    ScoreCalculationResponse:
      type: object
      properties:
        score:
          type: number
        explanations:
          type: array
          items:
            type: string
        meta:
          type: object
          additionalProperties: true
      required:
        - score
    ErrorResponseBody:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required:
            - code
            - message
        meta:
          type: object
          additionalProperties: true
      required:
        - error
    LocalizedString:
      type: object
      properties:
        locale:
          type: string
        value:
          type: string
      required:
        - locale
        - value
